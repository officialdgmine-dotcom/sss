<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b0710">
<meta name="mobile-web-app-capable" content="yes">
<title>SANATANAM — नवीन सदस्यता पंजीकरण</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
    --maroon:#3b0710;
    --maroon-2:#5b0b18;
    --maroon-3:#791226;
    --gold:#d4af37;
    --gold-light:#f4d77b;
    --gold-soft:#e8c96b;
    --cream:#fff8e8;
    --cream-2:#eadfc9;
    --text:#fffaf0;
    --muted:#cbbda9;
    --safe-top:env(safe-area-inset-top);
    --safe-bottom:env(safe-area-inset-bottom);
}
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html, body{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
}
body{
    background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,.15), transparent 35%),
        radial-gradient(circle at 10% 80%, rgba(121,18,38,.25), transparent 35%),
        linear-gradient(145deg,#21040a,#3b0710 45%,#170207);
    color:var(--text);
    font-family:'Poppins', 'Noto Sans Devanagari', sans-serif;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding: calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
}
.register-container{
    width:min(100%, 480px);
    background:linear-gradient(180deg, rgba(91,11,24,.6), rgba(33,4,10,.8));
    border:1px solid rgba(212,175,55,.32);
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 18px 45px rgba(0,0,0,.6);
    backdrop-filter:blur(16px);
}
.header-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}
.back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(212,175,55,.3);
    color:var(--gold-light);
    font-size:20px;
    cursor:pointer;
    text-decoration:none;
}
.header-badge{
    font-size:11px;
    font-weight:700;
    color:var(--gold-soft);
    letter-spacing:1px;
    text-transform:uppercase;
    background:rgba(212,175,55,.1);
    padding:6px 14px;
    border-radius:20px;
    border:1px solid rgba(212,175,55,.25);
}
.brand-hero{
    text-align:center;
    margin-bottom:24px;
}
.brand-logo{
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid var(--gold);
    box-shadow:0 0 25px rgba(212,175,55,.4);
    object-fit:cover;
    margin-bottom:12px;
}
.title-reg{
    font-family:'Cinzel', 'Noto Sans Devanagari', serif;
    font-size:22px;
    font-weight:700;
    color:var(--gold-light);
    margin:0 0 6px 0;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
}
.subtitle-reg{
    font-size:13px;
    color:var(--muted);
    margin:0;
}
.form-group{
    margin-bottom:16px;
}
.form-label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--gold-soft);
    margin-bottom:6px;
}
.form-input, .form-select{
    width:100%;
    padding:13px 15px;
    background:rgba(18,2,6,.65);
    border:1px solid rgba(212,175,55,.28);
    border-radius:12px;
    color:var(--text);
    font-size:14px;
    outline:none;
    box-sizing:border-box;
    transition:border-color .2s, box-shadow .2s;
}
.form-input:focus, .form-select:focus{
    border-color:var(--gold-light);
    box-shadow:0 0 10px rgba(212,175,55,.3);
}
.form-select option{
    background:#2b050d;
    color:#fff;
}
.btn-submit{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:linear-gradient(135deg, #f4d77b, #d4af37 60%, #b8860b);
    border:none;
    border-radius:14px;
    color:#2a050c;
    font-size:15px;
    font-weight:800;
    letter-spacing:.5px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(212,175,55,.4);
    transition:transform .15s, box-shadow .15s;
}
.btn-submit:active{
    transform:scale(0.98);
}
.nav-links{
    margin-top:20px;
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.link-alt{
    color:var(--muted);
    font-size:13px;
    text-decoration:none;
    transition:color .2s;
}
.link-alt span{
    color:var(--gold-soft);
    font-weight:600;
}
.link-guest{
    font-size:12.5px;
    color:rgba(255,255,255,.5);
    text-decoration:underline;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="register-container">
    <div class="header-bar">
        <a href="app_welcome.html" class="back-btn" aria-label="Back">‹</a>
        <div class="header-badge" id="regBadge">सनातन सेवा संकल्प</div>
    </div>

    <div class="brand-hero">
        <img src="assets/branding/app_logo.png" onerror="this.onerror=null; this.src='app_logo.png';" alt="Emblem" class="brand-logo">
        <h1 class="title-reg" id="regTitle">नवीन सदस्यता पंजीकरण</h1>
        <p class="subtitle-reg" id="regSubtitle">राष्ट्र एवं धर्म की रक्षा हेतु समर्पित सनातन सेवा परिवार में जुड़ें</p>
    </div>

    <form id="registerForm" onsubmit="handleRegistration(event)">
        <div class="form-group">
            <label class="form-label" id="lbl_name" for="fullName">पूरा नाम (Full Name) *</label>
            <input type="text" id="fullName" class="form-input" placeholder="e.g. राहुल शर्मा" required>
        </div>

        <div class="form-group">
            <label class="form-label" id="lbl_phone" for="phoneNumber">मोबाइल / व्हाट्सएप नंबर (Mobile) *</label>
            <input type="tel" id="phoneNumber" class="form-input" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group">
            <label class="form-label" id="lbl_email" for="emailAddr">ई-मेल (Email - वैकल्पिक)</label>
            <input type="email" id="emailAddr" class="form-input" placeholder="e.g. seva@sanatan.org">
        </div>

        <div class="form-group">
            <label class="form-label" id="lbl_city" for="cityState">नगर / ज़िला व राज्य (City & State) *</label>
            <input type="text" id="cityState" class="form-input" placeholder="e.g. प्रयागराज, उत्तर प्रदेश" required>
        </div>

        <div class="form-group">
            <label class="form-label" id="lbl_seva" for="sevaType">सेवा संकल्प श्रेणी (Seva Category)</label>
            <select id="sevaType" class="form-select">
                <option value="gau_seva">गौ सेवा एवं संवर्धन (Gau Seva)</option>
                <option value="anna_daan">अन्नदान महाअभियान (Anna Daan)</option>
                <option value="dharma_jagran">धर्म जागरण एवं युवा संस्कार (Sanskar)</option>
                <option value="temple_seva">मंदिर सेवा एवं स्वच्छता (Temple Seva)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmitReg">
            ✦ सदस्यता स्वीकार करें (Register)
        </button>
    </form>

    <div class="nav-links">
        <a href="app_login.html" class="link-alt">
            पहले से पंजीकृत हैं? <span id="loginLinkText">सदस्य लॉगिन करें →</span>
        </a>
        <a href="app_home.html" class="link-guest" onclick="skipToHome(event)">
            बिना पंजीकरण सीधे मुख्य पृष्ठ पर जाएं (Skip to Home)
        </a>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const lang = urlParams.get("lang") || localStorage.getItem("sanatanam_app_lang") || "hi";

function handleRegistration(e) {
    e.preventDefault();
    const name = document.getElementById("fullName").value.trim();
    const phone = document.getElementById("phoneNumber").value.trim();
    const email = document.getElementById("emailAddr").value.trim();
    const city = document.getElementById("cityState").value.trim();
    const seva = document.getElementById("sevaType").value;

    if (!name || !phone) {
        alert("कृपया नाम एवं मोबाइल नंबर अवश्य भरें!");
        return;
    }

    const memberData = {
        name: name,
        phone: phone,
        email: email,
        city: city,
        seva: seva,
        registeredAt: new Date().toISOString()
    };

    localStorage.setItem("sanatanam_member_profile", JSON.stringify(memberData));
    localStorage.setItem("sanatanam_session_token", "active_" + Date.now());

    // Native Android Bridge integration
    if (window.AndroidBridge && typeof window.AndroidBridge.registerMember === "function") {
        try {
            window.AndroidBridge.registerMember(name, phone, email, city, seva);
        } catch(err) {
            console.warn("AndroidBridge registration:", err);
        }
    }

    alert("हार्दिक बधाई! आपका सनातन सेवा संकल्प पंजीकरण सफल हुआ।");
    window.location.replace("app_home.html");
}

function skipToHome(e) {
    e.preventDefault();
    localStorage.setItem("sanatanam_session_token", "guest_" + Date.now());
    window.location.replace("app_home.html");
}
</script>

</body>
</html>
