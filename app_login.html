<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3B070C">
<title>SANATANAM — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#681017;
  --maroon-dark:#3B070C;
  --maroon-soft:#8B2025;
  --orange:#F36B16;
  --orange-dark:#D94A0B;
  --orange-soft:#FFF1E7;
  --gold:#D4AF37;
  --white:#FFFFFF;
  --ink:#281719;
  --muted:#806B6D;
  --line:#E9D9D5;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body{ width:100%; min-height:100%; }
body{
  min-height:100vh;
  font-family:'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background:var(--maroon-dark);
  color:var(--ink);
  overflow-x:hidden;
}
.app-stage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% -12%, rgba(243,107,22,.50), transparent 35%),
    radial-gradient(circle at 100% 100%, rgba(243,107,22,.15), transparent 34%),
    linear-gradient(180deg, #72151C 0%, #570C12 53%, #3B070C 100%);
}
.login-shell{ width:100%; max-width:430px; position:relative; z-index:5; }
.brand-zone{ text-align:center; color:white; margin-bottom:20px; }
.logo-stage{
  width:96px; height:96px; margin:0 auto 12px; position:relative;
  display:flex; align-items:center; justify-content:center;
}
.logo-img{
  width:82px; height:82px; border-radius:50%; object-fit:cover;
  border:3px solid white; background:#fff; box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.brand-name{ font-size:24px; font-weight:900; line-height:1.2; }
.brand-sub{ margin-top:5px; color:rgba(255,255,255,.72); font-size:10px; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
.brand-line{ width:42px; height:3px; margin:10px auto 0; border-radius:10px; background:var(--orange); }

.login-panel{
  background:var(--white);
  border-radius:30px;
  padding:26px 20px 22px;
  box-shadow:0 30px 70px rgba(22,2,5,.45);
  position:relative;
  overflow:hidden;
}
.login-panel::before{
  content:""; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg, var(--orange-dark), var(--orange), var(--orange-dark));
}
.panel-kicker{ color:var(--orange-dark); font-size:10.5px; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:4px; }
.panel-title{ font-size:22px; font-weight:900; color:var(--maroon); line-height:1.25; }
.panel-desc{ margin:6px 0 16px; color:var(--muted); font-size:12px; line-height:1.5; }
.msg-box{
  display:none; margin-bottom:14px; padding:11px 13px; border-radius:12px;
  background:#FFF0EE; color:#A51D20; border-left:3.5px solid #C52B2E;
  font-size:12px; font-weight:800; line-height:1.45;
}
.form-group{ margin-bottom:15px; }
.form-label{ display:block; margin-bottom:6px; color:#57383A; font-size:11px; font-weight:800; letter-spacing:.3px; }
.field{ position:relative; }
.field-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--orange); font-size:14px; pointer-events:none; }
.input-box{
  width:100%; height:52px; padding:0 14px 0 42px; border-radius:14px;
  border:1px solid var(--line); outline:none; font-size:13.5px; font-weight:600;
  color:var(--ink); background:#fff; transition:border-color .2s ease;
}
.input-box:focus{ border-color:var(--orange); box-shadow:0 0 0 3px rgba(243,107,22,.12); }
.btn-login{
  width:100%; height:52px; margin-top:4px; border:0; border-radius:15px;
  background:linear-gradient(135deg, var(--orange), var(--orange-dark));
  color:white; font-size:13px; font-weight:900; letter-spacing:1px; cursor:pointer;
  box-shadow:0 8px 22px rgba(217,74,11,.28); transition:transform .15s ease, opacity .2s;
}
.btn-login:active{ transform:scale(0.98); }
.btn-login:disabled{ opacity:.65; cursor:not-allowed; }

.action-row{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:13px; }
.action-button{
  min-height:42px; display:flex; align-items:center; justify-content:center;
  border-radius:12px; background:#FFF8F5; border:1px solid #F0DEDA;
  color:#71383A; font-size:11px; font-weight:800; cursor:pointer;
}
.action-button:active{ background:var(--orange-soft); }

.register-area{ margin-top:16px; padding-top:16px; border-top:1px solid #F0E5E2; text-align:center; }
.register-caption{ color:#998486; font-size:10.5px; font-weight:600; margin-bottom:8px; }
.btn-reg{
  width:100%; min-height:48px; display:flex; align-items:center; justify-content:center;
  border-radius:14px; text-decoration:none; color:var(--maroon);
  border:1.5px solid var(--orange); font-size:12px; font-weight:900; background:#fff;
}
.btn-reg:active{ background:var(--orange-soft); }
.panel-footer{ text-align:center; margin-top:15px; color:#A99899; font-size:9.5px; font-weight:700; letter-spacing:.8px; }

/* MODALS */
.modal{
  display:none; position:fixed; inset:0; z-index:999;
  align-items:flex-end; justify-content:center; background:rgba(35,4,7,.78);
  backdrop-filter:blur(6px);
}
.modal-box{
  width:100%; max-width:430px; padding:22px 20px max(24px, env(safe-area-inset-bottom));
  background:#FFFFFF; border-radius:28px 28px 0 0; border-top:4px solid var(--orange);
  box-shadow:0 -15px 40px rgba(0,0,0,.35);
}
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-weight:900; color:var(--maroon); }
.modal-close{ width:30px; height:30px; border-radius:50%; background:#FFF0EE; border:none; color:var(--maroon); font-size:14px; font-weight:900; cursor:pointer; }
.member-found-card{
  margin-top:12px; padding:12px; border-radius:14px; background:#FFF8F5;
  border:1.5px solid #F0DCD7; display:flex; align-items:center; justify-content:space-between;
}
.fill-id-btn{
  background:var(--orange); color:#fff; border:none; padding:7px 12px;
  border-radius:8px; font-size:10.5px; font-weight:800; cursor:pointer;
}
</style>

<div class="app-stage">
  <main class="login-shell">
    
    <!-- BRAND HEADER -->
    <section class="brand-zone">
      <div class="logo-stage">
        <img src="assets/branding/app_logo.png" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='app_logo.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='https://sanatansevasamiti.org/Images/logo.jpg';}" class="logo-img" alt="SANATANAM">
      </div>
      <h1 class="brand-name" id="loginOrgTitle">सनातन सेवा समिति</h1>
      <div class="brand-sub">SANATANAM • DIGITAL SEVA</div>
      <div class="brand-line"></div>
    </section>

    <!-- LOGIN FORM PANEL -->
    <section class="login-panel">
      <div class="panel-kicker" id="txtMemberAccess">MEMBER ACCESS</div>
      <h2 class="panel-title" id="txtWelcomeBack">Welcome Back</h2>

</div>

/* MODAL UTILITIES */
function openModal(id){ document.getElementById(id).style.display = "flex"; }
function closeModal(id){ document.getElementById(id).style.display = "none"; }
function closeModalOnBackdrop(e, id){ if(e.target.id === id) closeModal(id); }

/* REAL AUTHENTICATION HANDLER */
async function handleAppLogin(e){
  e.preventDefault();
  const btn = document.getElementById("btnLoginSubmit");
  const alertBox = document.getElementById("alertBox");
  alertBox.style.display = "none";

  const loginInput = document.getElementById("loginId").value.trim();
  const passwordInput = document.getElementById("loginPass").value;

  if(!loginInput || !passwordInput){
    alertBox.textContent = "कृपया Unique ID / मोबाइल और पासवर्ड दर्ज करें!";
    alertBox.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "सत्यापन जारी है...";

  try {
    const res = await fetch(API_LOGIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        action: "login",
        unique_id: loginInput,
        password: passwordInput
      })
    });

    const data = await res.json();

    if(data.status){
      // 1. Storage & Session Token Lock
      localStorage.setItem("sss_user_token", data.token);
      localStorage.setItem("sss_user_data", JSON.stringify(data.user));
      localStorage.setItem("sanatanam_session_token", "active_" + Date.now());

      // 2. Android WebView Bridge Hook
      if(window.AndroidBridge && typeof window.AndroidBridge.onAuthSuccess === "function"){
        try {
          window.AndroidBridge.onAuthSuccess(data.token, JSON.stringify(data.user));
        } catch(bridgeErr){
          console.warn("Bridge auth notification:", bridgeErr);
        }
      } else if(window.AndroidBridge && typeof window.AndroidBridge.saveUserData === "function"){
        try {
          window.AndroidBridge.saveUserData(JSON.stringify(data.user));
        } catch(e){}
      }

      if(window.AndroidBridge && typeof window.AndroidBridge.showToast === "function"){
        window.AndroidBridge.showToast("लॉगिन सफल!");
      }

      // 3. Navigate to Dashboard
      if(window.AndroidBridge && typeof window.AndroidBridge.openNativeScreen === "function"){
        window.AndroidBridge.openNativeScreen("app_home");
      } else {
        const lang = localStorage.getItem("sanatanam_app_lang") || "hi";
        window.location.replace(`app_home.html?lang=${encodeURIComponent(lang)}`);
      }
    } else {
      alertBox.textContent = data.message || "गलत Unique ID, मोबाइल नंबर या पासवर्ड!";
      alertBox.style.display = "block";
    }
  } catch(err){
    alertBox.textContent = "सर्वर से कनेक्ट करने में असमर्थ। कृपया इंटरनेट कनेक्शन जांचें।";
    alertBox.style.display = "block";
  } finally {
    btn.disabled = false;
    const lang = localStorage.getItem("sanatanam_app_lang") || "hi";
    btn.textContent = (i18nLog[lang] || i18nLog.hi).btnLogin;
  }
}

/* REAL FORGOT ID SEARCH HANDLER */
async function searchUserId(){
  const kw = document.getElementById("fidKeyword").value.trim();
  const box = document.getElementById("fidResult");

  if(!kw){
    alert("कृपया नाम या मोबाइल नंबर दर्ज करें!");
    return;
  }

  box.innerHTML = `<div style="text-align:center; color:#d94a0b; font-size:11.5px; font-weight:800; padding:12px 0;">खोजा जा रहा है...</div>`;

  try {
    const res = await fetch(API_LOGIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ action: "find_id", keyword: kw })
    });

    const data = await res.json();

    if(data.status && data.data){
      const u = data.data;
      box.innerHTML = `
        <div class="member-found-card">
          <div>
            <div style="font-weight:900; font-size:13px; color:#281719;">${u.full_name}</div>
            <div style="font-weight:900; font-size:11.5px; color:#d94a0b; margin-top:2px;">ID: ${u.unique_id}</div>
          </div>
          <button type="button" class="fill-id-btn" onclick="fillMemberId('${u.unique_id}')">ID भरें</button>
        </div>`;
    } else {
      box.innerHTML = `<div style="text-align:center; color:#ba1b2d; font-size:11px; font-weight:700; padding:10px 0;">${data.message || "कोई स्वीकृत यूज़र ID नहीं मिली!"}</div>`;
    }
  } catch(e){
    box.innerHTML = `<div style="text-align:center; color:#ba1b2d; font-size:11px; font-weight:700; padding:10px 0;">खोजने में समस्या आई।</div>`;
  }
}

function fillMemberId(id){
  document.getElementById("loginId").value = id;
  closeModal("fidModal");
  document.getElementById("loginPass").focus();
}

/* WHATSAPP PASSWORD RESET SCRIPT */
function sendWhatsAppReset(){
  const name = document.getElementById("fpName").value.trim();
  const mob = document.getElementById("fpMobile").value.trim();

  if(!name || !mob){
    alert("कृपया नाम और मोबाइल नंबर दोनों भरें!");
    return;
  }

  const msg = `🔐 PASSWORD RESET REQUEST\n👤 Name: ${name}\n📱 Mobile: ${mob}\n⚡ System: Sanatan Seva Samiti (SANATANAM)`;
  const url = `https://wa.me/${SUPPORT_WHATSAPP}?text=${encodeURIComponent(msg)}`;

  if(window.AndroidBridge && typeof window.AndroidBridge.openExternalUrl === "function"){
    window.AndroidBridge.openExternalUrl(url);
  } else {
    window.open(url, "_blank");
  }
}
