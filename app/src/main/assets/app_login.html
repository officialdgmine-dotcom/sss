<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b0710">
<meta name="mobile-web-app-capable" content="yes">
<title>SANATANAM — सदस्य लॉगिन</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
    --maroon:#3b0710;
    --maroon-2:#5b0b18;
    --maroon-3:#791226;
    --gold:#d4af37;
    --gold-light:#f4d77b;
    --gold-soft:#e8c96b;
    --cream:#fff8e8;
    --cream-2:#eadfc9;
    --text:#fffaf0;
    --muted:#cbbda9;
    --safe-top:env(safe-area-inset-top);
    --safe-bottom:env(safe-area-inset-bottom);
}
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html, body{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
}
body{
    background:
        radial-gradient(circle at 50% 0%, rgba(212,175,55,.15), transparent 35%),
        radial-gradient(circle at 10% 80%, rgba(121,18,38,.25), transparent 35%),
        linear-gradient(145deg,#21040a,#3b0710 45%,#170207);
    color:var(--text);
    font-family:'Poppins', 'Noto Sans Devanagari', sans-serif;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding: calc(20px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
}
.login-container{
    width:min(100%, 460px);
    background:linear-gradient(180deg, rgba(91,11,24,.6), rgba(33,4,10,.8));
    border:1px solid rgba(212,175,55,.32);
    border-radius:24px;
    padding:30px 24px;
    box-shadow:0 18px 45px rgba(0,0,0,.6);
    backdrop-filter:blur(16px);
}
.header-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
}
.back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(212,175,55,.3);
    color:var(--gold-light);
    font-size:20px;
    cursor:pointer;
    text-decoration:none;
}
.header-badge{
    font-size:11px;
    font-weight:700;
    color:var(--gold-soft);
    letter-spacing:1px;
    text-transform:uppercase;
    background:rgba(212,175,55,.1);
    padding:6px 14px;
    border-radius:20px;
    border:1px solid rgba(212,175,55,.25);
}
.brand-hero{
    text-align:center;
    margin-bottom:28px;
}
.brand-logo{
    width:76px;
    height:76px;
    border-radius:50%;
    border:2px solid var(--gold);
    box-shadow:0 0 25px rgba(212,175,55,.4);
    object-fit:cover;
    margin-bottom:14px;
}
.title-login{
    font-family:'Cinzel', 'Noto Sans Devanagari', serif;
    font-size:23px;
    font-weight:700;
    color:var(--gold-light);
    margin:0 0 6px 0;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
}
.subtitle-login{
    font-size:13px;
    color:var(--muted);
    margin:0;
}
.form-group{
    margin-bottom:18px;
}
.form-label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--gold-soft);
    margin-bottom:7px;
}
.form-input{
    width:100%;
    padding:14px 16px;
    background:rgba(18,2,6,.65);
    border:1px solid rgba(212,175,55,.28);
    border-radius:12px;
    color:var(--text);
    font-size:14.5px;
    outline:none;
    box-sizing:border-box;
    transition:border-color .2s, box-shadow .2s;
}
.form-input:focus{
    border-color:var(--gold-light);
    box-shadow:0 0 10px rgba(212,175,55,.3);
}
.btn-submit{
    width:100%;
    padding:14px;
    margin-top:12px;
    background:linear-gradient(135deg, #f4d77b, #d4af37 60%, #b8860b);
    border:none;
    border-radius:14px;
    color:#2a050c;
    font-size:15px;
    font-weight:800;
    letter-spacing:.5px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(212,175,55,.4);
    transition:transform .15s, box-shadow .15s;
}
.btn-submit:active{
    transform:scale(0.98);
}
.nav-links{
    margin-top:24px;
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:12px;
}
.link-alt{
    color:var(--muted);
    font-size:13.5px;
    text-decoration:none;
}
.link-alt span{
    color:var(--gold-soft);
    font-weight:600;
}
.link-guest{
    font-size:13px;
    color:rgba(255,255,255,.55);
    text-decoration:underline;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="login-container">
    <div class="header-bar">
        <a href="app_welcome.html" class="back-btn" aria-label="Back">‹</a>
        <div class="header-badge">सदस्य सेवा केंद्र</div>
    </div>

    <div class="brand-hero">
        <img src="assets/branding/app_logo.png" onerror="this.onerror=null; this.src='app_logo.png';" alt="Emblem" class="brand-logo">
        <h1 class="title-login">सनातन सदस्य लॉगिन</h1>
        <p class="subtitle-login">अपने पंजीकृत विवरण के साथ प्रवेश करें</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label class="form-label" for="loginIdentity">मोबाइल नंबर अथवा ई-मेल (Mobile / Email)</label>
            <input type="text" id="loginIdentity" class="form-input" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="loginPass">पासवर्ड अथवा पिन (Password / PIN)</label>
            <input type="password" id="loginPass" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">
            → सदस्य लॉगिन करें (Sign In)
        </button>
    </form>

    <div class="nav-links">
        <a href="app_register.html" class="link-alt">
            खाता नहीं है? <span>नया पंजीकरण करें (Create Account) →</span>
        </a>
        <a href="app_home.html" class="link-guest" onclick="skipToHome(event)">
            अतिथि के रूप में आगे बढ़ें (Continue as Guest)
        </a>
    </div>
</div>

<script>
function handleLogin(e) {
    e.preventDefault();
    const identity = document.getElementById("loginIdentity").value.trim();
    if (!identity) {
        alert("कृपया अपना मोबाइल नंबर अथवा ई-मेल दर्ज करें!");
        return;
    }

    localStorage.setItem("sanatanam_session_token", "active_" + Date.now());
    window.location.replace("app_home.html");
}

function skipToHome(e) {
    e.preventDefault();
    localStorage.setItem("sanatanam_session_token", "guest_" + Date.now());
    window.location.replace("app_home.html");
}
</script>

</body>
</html>
