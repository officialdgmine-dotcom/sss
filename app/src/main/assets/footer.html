<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Sanatani Ð₲ — Navigation</title>

<style>

/* =========================================================
   SANATANI Ð₲
   FLAGSHIP DIAMOND NAVIGATION SYSTEM
   Version: 2.0
   ========================================================= */


/* =========================================================
   DESIGN TOKENS
   ========================================================= */

:root {

    --nav-h: 78px;

    --obsidian: #09070a;
    --obsidian-2: #110b10;
    --wine: #250b13;

    --maroon: #5b0d19;
    --crimson: #8d1627;

    --diamond: #f8fbff;
    --platinum: #dce5ef;
    --silver: #aeb9c7;

    --champagne: #f4dfaa;
    --gold: #cda95a;

    --bhagwa: #f26b19;

    --text: #f8f4eb;
    --muted: rgba(238,235,229,.56);

    --glass-border:
        rgba(255,255,255,.105);

    --glass-highlight:
        rgba(255,255,255,.075);

    --shadow:
        rgba(0,0,0,.58);

    --diamond-glow:
        rgba(238,246,255,.34);

    --gold-glow:
        rgba(221,184,94,.28);

}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #fffaf3;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    padding-bottom:
        calc(
            var(--nav-h)
            + env(safe-area-inset-bottom)
            + 24px
        );
}


/* =========================================================
   PAGE CONTENT
   ========================================================= */

#app-content {
    width: 100%;
    min-height: 100vh;
}


/* =========================================================
   NAVIGATION STAGE
   ========================================================= */

.sanatani-navigation-stage {

    position: fixed;

    left: 0;
    right: 0;

    bottom: 0;

    z-index: 99999;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    pointer-events: none;

    padding:

        0

        10px

        calc(
            10px +
            env(safe-area-inset-bottom)
        )

        10px;
}


/* =========================================================
   MAIN FLOATING RAIL
   ========================================================= */

.sanatani-bottom-nav {

    position: relative;

    width: min(
        680px,
        calc(100vw - 20px)
    );

    height: var(--nav-h);

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1.18fr
        1fr
        1fr;

    align-items: center;

    padding:
        7px 8px 6px;

    border-radius: 25px;

    pointer-events: auto;

    background:

        linear-gradient(
            180deg,
            rgba(29,22,28,.96),
            rgba(7,6,9,.985)
        );

    border:
        1px solid
        var(--glass-border);

    box-shadow:

        0 18px 48px
        rgba(0,0,0,.50),

        0 4px 14px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.09),

        inset 0 -1px 0
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(24px)
        saturate(145%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(145%);

}


/* =========================================================
   TOP CRYSTAL HAIRLINE
   ========================================================= */

.sanatani-bottom-nav::before {

    content: "";

    position: absolute;

    left: 7%;
    right: 7%;

    top: 0;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(216,226,238,.18),
            rgba(244,223,170,.42),
            rgba(216,226,238,.18),
            transparent
        );

    opacity: .9;

}


/* =========================================================
   BOTTOM INNER LIGHT
   ========================================================= */

.sanatani-bottom-nav::after {

    content: "";

    position: absolute;

    left: 18%;
    right: 18%;

    bottom: 0;

    height: 18px;

    background:

        radial-gradient(
            ellipse,
            rgba(255,255,255,.045),
            transparent 72%
        );

    pointer-events: none;

}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item {

    position: relative;

    height: 66px;

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 4px;

    padding: 4px 2px;

    border: 0;

    outline: none;

    background: transparent;

    text-decoration: none;

    color: var(--muted);

    cursor: pointer;

    font-family: inherit;

    transition:

        transform .22s cubic-bezier(.2,.8,.2,1),

        color .22s ease;

}


.nav-item:active {

    transform:
        scale(.91);

}


/* =========================================================
   NORMAL ICON HOLDER
   ========================================================= */

.nav-icon-box {

    position: relative;

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    transition:

        background .25s ease,
        box-shadow .25s ease,
        transform .25s ease;

}


/* =========================================================
   ICON
   ========================================================= */

.nav-icon {

    width: 31px;
    height: 31px;

    display: block;

    object-fit: contain;

    opacity: .70;

    filter:

        drop-shadow(
            0 2px 4px
            rgba(0,0,0,.45)
        );

    transition:

        opacity .25s ease,
        transform .25s ease,
        filter .25s ease;
}


/* =========================================================
   NORMAL LABEL
   ========================================================= */

.nav-label {

    max-width: 100%;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 9.5px;

    line-height: 1;

    font-weight: 600;

    letter-spacing: .02em;

    color: inherit;

    transition:
        color .25s ease,
        opacity .25s ease;
}


/* =========================================================
   ACTIVE NORMAL ITEM
   ========================================================= */

.nav-item.active:not(.nav-center) {

    color:
        var(--diamond);

}


.nav-item.active:not(.nav-center)
.nav-icon-box {

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.075),
            transparent 72%
        );

    box-shadow:

        0 0 22px
        rgba(215,226,239,.055);

}


.nav-item.active:not(.nav-center)
.nav-icon {

    opacity: 1;

    transform:
        translateY(-1px)
        scale(1.07);

    filter:

        drop-shadow(
            0 0 7px
            rgba(230,239,248,.30)
        );
}


/* =========================================================
   ACTIVE CRYSTAL INDICATOR
   ========================================================= */

.nav-item.active:not(.nav-center)::after {

    content: "";

    position: absolute;

    bottom: 2px;

    left: 50%;

    width: 18px;
    height: 2px;

    transform:
        translateX(-50%);

    border-radius: 20px;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--diamond),
            transparent
        );

    box-shadow:

        0 0 9px
        rgba(226,237,249,.62);
}


/* =========================================================
   CENTER SANATANI Ð₲
   ========================================================= */

.nav-center {

    height: 82px;

    margin-top: -22px;

    z-index: 30;

    justify-content: flex-end;

}


/* =========================================================
   DIAMOND CORE
   ========================================================= */

.center-icon-wrap {

    position: relative;

    width: 67px;
    height: 67px;

    display: flex;

    align-items: center;
    justify-content: center;

    transform:
        rotate(45deg);

    border-radius: 19px;

    background:

        linear-gradient(
            145deg,
            #3a1720 0%,
            #160b10 44%,
            #08070a 100%
        );

    border:

        1px solid
        rgba(225,232,240,.40);

    box-shadow:

        0 16px 30px
        rgba(0,0,0,.55),

        0 0 0 1px
        rgba(205,169,90,.18),

        0 0 28px
        rgba(222,232,242,.13),

        inset 0 1px 0
        rgba(255,255,255,.16),

        inset 0 -8px 20px
        rgba(0,0,0,.30);

    transition:

        transform .28s
        cubic-bezier(.2,.8,.2,1),

        box-shadow .28s ease;

}


/* =========================================================
   DIAMOND INNER FRAME
   ========================================================= */

.center-icon-wrap::before {

    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 13px;

    border:
        1px solid
        rgba(244,223,170,.30);

    box-shadow:

        inset 0 0 14px
        rgba(255,255,255,.035),

        0 0 10px
        rgba(220,230,240,.08);

}


/* =========================================================
   DIAMOND LIGHT
   ========================================================= */

.center-icon-wrap::after {

    content: "";

    position: absolute;

    width: 42px;
    height: 42px;

    top: 4px;
    left: 4px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,244,205,.17),
            rgba(221,187,103,.07) 32%,
            transparent 70%
        );

    filter: blur(2px);

}


/* =========================================================
   CENTER IMAGE
   ========================================================= */

.center-icon {

    position: relative;

    z-index: 5;

    width: 49px;
    height: 49px;

    object-fit: contain;

    display: block;

    transform:
        rotate(-45deg);

    filter:

        drop-shadow(
            0 0 7px
            rgba(245,223,164,.34)
        )

        drop-shadow(
            0 4px 8px
            rgba(0,0,0,.50)
        );

}


/* =========================================================
   CENTER LABEL
   ========================================================= */

.center-label {

    margin-top: 7px;

    font-size: 9.5px;

    line-height: 1;

    font-weight: 700;

    letter-spacing: .015em;

    white-space: nowrap;

    color:
        var(--champagne);

    text-shadow:

        0 1px 5px
        rgba(0,0,0,.55);

}


/* =========================================================
   CENTER HOVER / ACTIVE
   ========================================================= */

.nav-center.active
.center-icon-wrap {

    transform:
        rotate(45deg)
        translateY(-2px)
        scale(1.035);

    border-color:
        rgba(244,223,170,.72);

    box-shadow:

        0 18px 34px
        rgba(0,0,0,.58),

        0 0 0 1px
        rgba(244,223,170,.18),

        0 0 32px
        rgba(228,236,245,.19),

        0 0 42px
        rgba(213,171,82,.12),

        inset 0 1px 0
        rgba(255,255,255,.22),

        inset 0 -8px 20px
        rgba(0,0,0,.30);

}


/* =========================================================
   SAMITI IMAGE
   ========================================================= */

.samiti-icon {

    width: 31px;
    height: 31px;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    border:
        1px solid
        rgba(220,228,237,.30);

    box-shadow:

        0 3px 8px
        rgba(0,0,0,.40);

    opacity: .76;

    transition:

        transform .25s ease,
        opacity .25s ease,
        box-shadow .25s ease;
}


.nav-item.active .samiti-icon {

    opacity: 1;

    transform:
        scale(1.07);

    border-color:
        rgba(244,223,170,.62);

    box-shadow:

        0 0 12px
        rgba(229,217,184,.22);
}


/* =========================================================
   DASHBOARD ICON
   ========================================================= */

.dashboard-icon {

    width: 31px;
    height: 31px;

    object-fit: contain;

    display: block;

    opacity: .72;

    filter:

        drop-shadow(
            0 2px 5px
            rgba(0,0,0,.45)
        );

    transition:

        transform .25s ease,
        opacity .25s ease,
        filter .25s ease;
}


.nav-item.active .dashboard-icon {

    opacity: 1;

    transform:
        scale(1.07);

    filter:

        drop-shadow(
            0 0 7px
            rgba(232,239,247,.30)
        );
}


/* =========================================================
   MICRO CRYSTAL DOT
   ========================================================= */

.nav-item:not(.nav-center)::before {

    content: "";

    position: absolute;

    top: 7px;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.20);

    opacity: .5;

}


/* =========================================================
   CENTER SEPARATOR LIGHTS
   ========================================================= */

.nav-center + .nav-item::before {

    box-shadow:
        -1px 0 0
        rgba(244,223,170,.03);

}


/* =========================================================
   PRESS FEEDBACK
   ========================================================= */

.nav-item:active
.nav-icon-box {

    transform:
        scale(.92);
}


/* =========================================================
   RESPONSIVE — SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    :root {
        --nav-h: 73px;
    }

    .sanatani-bottom-nav {

        border-radius: 22px;

        padding-left: 5px;
        padding-right: 5px;
    }

    .nav-item {

        height: 62px;

    }

    .nav-icon-box {

        width: 34px;
        height: 34px;
    }

    .nav-icon {

        width: 27px;
        height: 27px;
    }

    .samiti-icon,
    .dashboard-icon {

        width: 27px;
        height: 27px;
    }

    .nav-label {

        font-size: 8.5px;
    }

    .center-icon-wrap {

        width: 61px;
        height: 61px;

        border-radius: 17px;
    }

    .center-icon {

        width: 44px;
        height: 44px;
    }

    .center-label {

        font-size: 8.5px;
    }

}


/* =========================================================
   VERY SMALL DEVICES
   ========================================================= */

@media (max-width: 330px) {

    .sanatani-bottom-nav {

        width:
            calc(100vw - 12px);

        padding-left: 3px;
        padding-right: 3px;
    }

    .nav-label {

        font-size: 8px;
    }

    .center-label {

        font-size: 8px;
    }

}


/* =========================================================
   TABLET / LARGE DISPLAY
   ========================================================= */

@media (min-width: 700px) {

    :root {
        --nav-h: 82px;
    }

    .sanatani-bottom-nav {

        border-radius: 28px;

        padding-left: 12px;
        padding-right: 12px;
    }

    .nav-icon {

        width: 33px;
        height: 33px;
    }

    .samiti-icon,
    .dashboard-icon {

        width: 33px;
        height: 33px;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        transition: none !important;

        animation: none !important;
    }

}


/* =========================================================
   ANDROID WEBVIEW SAFE AREA
   ========================================================= */

@supports (padding-bottom: env(safe-area-inset-bottom)) {

    .sanatani-navigation-stage {

        padding-bottom:
            calc(
                10px +
                env(safe-area-inset-bottom)
            );
    }

}


/* =========================================================
   LANDSCAPE PHONE
   ========================================================= */

@media
    (orientation: landscape)
    and (max-height: 500px) {

    :root {
        --nav-h: 68px;
    }

    .sanatani-bottom-nav {

        width: min(
            620px,
            calc(100vw - 30px)
        );

        border-radius: 22px;
    }

    .nav-item {

        height: 58px;
    }

    .center-icon-wrap {

        width: 56px;
        height: 56px;
    }

    .center-icon {

        width: 40px;
        height: 40px;
    }

}


/* =========================================================
   END OF DESIGN
   ========================================================= */

</style>
</head>

<div class="sanatani-navigation-stage">

<nav
    class="sanatani-bottom-nav"

        </span>

    <!-- ===================================================

         =================================================== -->

    <a
        href="sanatani-ai.php"

        data-page="sanatani-ai"
        aria-label="Sanatani Ð₲"
    >

        <span class="center-icon-wrap">

                src="branding/footer/Ð₲.png"

    >

                src="branding/footer/PRO1781011172_dp.jpg"
                class="samiti-icon"

                loading="eager"
            >

        </span>

        <span class="nav-label">

                src="branding/footer/accounts.png"

<script>

/* =========================================================
   SANATANI Ð₲
   NAVIGATION ENGINE
   ========================================================= */

(function () {

    "use strict";


    const nav =
        document.getElementById(
            "sanataniBottomNav"
        );


    if (!nav) {
        return;
    }


    const items =
        nav.querySelectorAll(
            ".nav-item"
        );


    /* =====================================================
       CURRENT PAGE DETECTION
       ===================================================== */

    const currentPath =
        window.location.pathname
            .split("/")
            .pop()
            .toLowerCase();


    let currentPage =
        "home";


    if (
        currentPath === "feed.php" ||
        currentPath.includes("feed")
    ) {

        currentPage =
            "feed";

    }

    else if (
        currentPath.includes("sanatani-ai")
    ) {

        currentPage =
            "sanatani-ai";

    }

    else if (
        currentPath.includes("sanatan-seva") ||
        currentPath.includes("samiti")
    ) {

        currentPage =
            "samiti";

    }

    else if (
        currentPath.includes("dashboard")
    ) {

        currentPage =
            "dashboard";

    }

    else if (
        currentPath.includes("app_home")
    ) {

        currentPage =
            "home";

    }


    /* =====================================================
       APPLY ACTIVE STATE
       ===================================================== */

    items.forEach(function (item) {

        const page =
            item.getAttribute(
                "data-page"
            );


        if (
            page === currentPage
        ) {

            item.classList.add(
                "active"
            );

        }

        else {

            item.classList.remove(
                "active"
            );

        }

    });


    /* =====================================================
       ANDROID WEBVIEW BRIDGE
       ===================================================== */

    items.forEach(function (item) {

        item.addEventListener(
            "click",
            function () {

                const page =
                    this.getAttribute(
                        "data-page"
                    );


                if (
                    window.AndroidBridge &&
                    typeof
                    window.AndroidBridge
                        .onBottomNavigationSelected
                    === "function"
                ) {

                    try {

                        window.AndroidBridge
                            .onBottomNavigationSelected(
                                page
                            );

                    }

                    catch (error) {

                        console.log(
                            "Android navigation bridge error:",
                            error
                        );

                    }

                }

            }
        );

    });


    /* =====================================================
       PREVENT DOUBLE-TAP ZOOM BEHAVIOUR
       ===================================================== */

    let lastTouchEnd = 0;


    document.addEventListener(
        "touchend",
        function (event) {

            const now =
                Date.now();


            if (
                now - lastTouchEnd <= 280
            ) {

                event.preventDefault();

            }


            lastTouchEnd =
                now;

        },
        {
            passive: false
        }
    );


})();

</script>
