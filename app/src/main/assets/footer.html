<style>

/* =========================================================
   SANATANAM — ULTRA PREMIUM ROYAL FOOTER
   BASE DESIGN PRESERVED
   ========================================================= */

:root{
    --sss-red:#8B0015;
    --sss-red-dark:#56000B;
    --sss-red-deep:#380006;

    --sss-bhagwa:#FF4A00;
    --sss-bhagwa-light:#FF7A18;

    --sss-gold:#D4AF37;
    --sss-gold-light:#FFE08A;
    --sss-gold-bright:#FFF0B0;

    --sss-cream:#FFF4D2;
}


/* =========================================================
   BODY
   ========================================================= */

body{
    padding-bottom:90px !important;
}


/* =========================================================
   FOOTER NAV
   ========================================================= */

#sss-nav{

    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:78px;

    display:flex;

    justify-content:space-evenly;

    align-items:center;

    background:

        /* Bhagwa royal glow */

        radial-gradient(
            ellipse 45% 80%
            at 50% 0%,
            rgba(255,122,24,.42),
            transparent 70%
        ),

        /* Main red */

        linear-gradient(
            180deg,
            #A51023 0%,
            #8B0015 38%,
            #68000E 72%,
            #4A0008 100%
        );

    border-top:
        4px solid
        var(--sss-gold);

    border-radius:
        22px
        22px
        0
        0;

    z-index:999999;

    box-shadow:

        0 -7px 28px
        rgba(52,0,7,.42),

        0 -1px 0
        rgba(255,240,169,.65),

        inset 0 1px 0
        rgba(255,255,255,.12),

        inset 0 7px 18px
        rgba(255,83,0,.08);

    overflow:visible;
}


/* =========================================================
   ROYAL GOLD + BHAGWA TOP LINES
   ========================================================= */

#sss-nav::before{

    content:"";

    position:absolute;

    left:13px;
    right:13px;

    top:-7px;

    height:16px;

    border-top:
        2px solid
        var(--sss-gold-light);

    border-radius:
        30px
        30px
        0
        0;

    box-shadow:

        0 3px 0
        var(--sss-bhagwa),

        0 6px 0
        var(--sss-gold),

        0 8px 0
        rgba(91,0,10,.95);

    pointer-events:none;
}


/* =========================================================
   INNER ROYAL HIGHLIGHT
   ========================================================= */

#sss-nav::after{

    content:"";

    position:absolute;

    left:32px;
    right:32px;

    top:7px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,232,151,.75),
            transparent
        );

    box-shadow:
        0 0 7px
        rgba(255,215,100,.28);

    pointer-events:none;
}


/* =========================================================
   NORMAL ITEMS
   ========================================================= */

.sss-item{

    position:relative;

    flex:1;

    height:68px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-end;

    gap:3px;

    text-align:center;

    text-decoration:none;

    color:
        rgba(255,244,210,.84);

    font-size:10px;

    font-weight:800;

    line-height:1;

    padding-bottom:4px;

    transition:
        transform .22s ease,
        color .22s ease;
}


/* =========================================================
   ICON
   ========================================================= */

.sss-item img{

    width:28px;
    height:28px;

    display:block;

    margin:auto;

    object-fit:contain;

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,.42)
        );

    transition:
        transform .22s ease,
        filter .22s ease,
        opacity .22s ease;
}


/* =========================================================
   ACTIVE PAGE
   ========================================================= */

.sss-item.sss-active{

    color:
        var(--sss-gold-bright);
}


/* =========================================================
   ACTIVE ICON ROYAL MARK
   ========================================================= */

.sss-item.sss-active:not(.sss-dash-wrap)::before{

    content:"";

    position:absolute;

    top:2px;

    width:42px;
    height:38px;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            rgba(255,224,138,.18),
            rgba(255,106,0,.06)
        );

    border:
        1px solid
        rgba(255,224,138,.72);

    box-shadow:

        0 0 0 1px
        rgba(73,0,9,.75),

        inset 0 1px 0
        rgba(255,244,181,.30),

        0 3px 12px
        rgba(255,205,78,.12);

    z-index:0;
}


.sss-item.sss-active:not(.sss-dash-wrap) img{

    transform:
        scale(1.08);

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,224,138,.65)
        );
}


.sss-item.sss-active span{

    color:
        var(--sss-gold-bright);

    text-shadow:
        0 1px 5px
        rgba(0,0,0,.6);
}


/* =========================================================
   SMALL ACTIVE GOLD MARK
   ========================================================= */

.sss-item.sss-active:not(.sss-dash-wrap)::after{

    content:"";

    position:absolute;

    bottom:-1px;

    width:7px;
    height:7px;

    transform:
        rotate(45deg);

    background:
        var(--sss-gold-light);

    border:
        1px solid
        #FFF0B0;

    box-shadow:
        0 0 8px
        rgba(255,216,91,.72);
}


/* =========================================================
   CENTER ITEM
   ========================================================= */

.sss-dash-wrap{

    margin-top:-31px;

    height:92px;

    z-index:20;

    justify-content:flex-end;

    padding-bottom:3px;
}


/* =========================================================
   CENTER ROYAL GOLD CIRCLE
   ========================================================= */

.sss-gold-circle{

    position:relative;

    width:64px;
    height:64px;

    background:

        radial-gradient(
            circle at 50% 25%,
            #B72A38 0%,
            #941324 35%,
            #6D000F 68%,
            #450007 100%
        );

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        3px solid
        var(--sss-gold-light);

    box-shadow:

        0 0 0 3px
        #65000D,

        0 0 0 5px
        rgba(212,175,55,.88),

        0 0 0 7px
        rgba(74,0,8,.82),

        0 0 22px
        rgba(255,210,91,.34),

        0 9px 22px
        rgba(40,0,6,.55),

        inset 0 2px 0
        rgba(255,245,185,.32);

    overflow:hidden;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


/* =========================================================
   CENTER INNER RING
   ========================================================= */

.sss-gold-circle::before{

    content:"";

    position:absolute;

    inset:6px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,226,135,.58);

    box-shadow:
        inset 0 0 12px
        rgba(255,210,79,.14);
}


/* =========================================================
   CENTER LIGHT
   ========================================================= */

.sss-gold-circle::after{

    content:"";

    position:absolute;

    width:65%;
    height:35%;

    left:18%;
    top:3px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,244,184,.24),
            transparent 70%
        );

    pointer-events:none;
}


/* =========================================================
   CENTER LOGO
   ========================================================= */

.sss-gold-circle img{

    position:relative;

    z-index:3;

    width:35px;
    height:35px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,230,145,.58)
        );

    margin:0;
}


/* =========================================================
   CENTER ACTIVE
   ========================================================= */

.sss-dash-wrap.sss-active
.sss-gold-circle{

    transform:
        translateY(-2px)
        scale(1.04);

    box-shadow:

        0 0 0 3px
        #65000D,

        0 0 0 5px
        var(--sss-gold-light),

        0 0 0 7px
        rgba(74,0,8,.9),

        0 0 29px
        rgba(255,213,95,.48),

        0 10px 23px
        rgba(40,0,6,.58),

        inset 0 2px 0
        rgba(255,245,185,.38);
}


/* =========================================================
   CENTER LABEL
   ========================================================= */

.sss-dash-wrap span{

    color:
        var(--sss-gold-bright);

    font-size:9px;

    font-weight:800;

    white-space:nowrap;

    text-shadow:
        0 1px 5px
        rgba(0,0,0,.65);
}


/* =========================================================
   SAMITI IMAGE
   ========================================================= */

.sss-item:nth-child(4) img{

    border-radius:50%;

    border:
        1px solid
        rgba(255,224,138,.68);
}


/* =========================================================
   PRESS EFFECT
   ========================================================= */

.sss-item:active{

    transform:
        scale(.94);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:380px){

    body{
        padding-bottom:86px !important;
    }

    #sss-nav{
        height:75px;
    }

    .sss-item{

        height:64px;

        font-size:8.5px;
    }

    .sss-item img{

        width:27px;
        height:27px;
    }

    .sss-dash-wrap{

        height:87px;

        margin-top:-27px;
    }

    .sss-gold-circle{

        width:59px;
        height:59px;
    }

    .sss-gold-circle img{

        width:33px;
        height:33px;
    }

    .sss-dash-wrap span{

        font-size:8px;
    }
}


/* =========================================================
   VERY SMALL SCREEN
   ========================================================= */

@media(max-width:330px){

    .sss-item{

        font-size:7.7px;
    }

    .sss-item img{

        width:25px;
        height:25px;
    }

    .sss-gold-circle{

        width:56px;
        height:56px;
    }

    .sss-gold-circle img{

        width:31px;
        height:31px;
    }
}

<script>

/* =========================================================
   ACTIVE PAGE DETECTION
   ========================================================= */

(function(){

    "use strict";


    const nav =
        document.getElementById("sss-nav");


    if(!nav) return;


    const items =
        nav.querySelectorAll(".sss-item");


    const currentPath =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();


    let currentPage = "home";


    /* HOME */

    if(
        currentPath === "" ||
        currentPath === "index.php" ||
        currentPath === "app_home.php"
    ){

        currentPage = "home";

    }


    /* FEED */

    else if(
        currentPath === "feed.php" ||
        currentPath.includes("feed")
    ){

        currentPage = "feed";

    }


    /* SANATANI AI */

    else if(
        currentPath.includes("sanatani-ai")
    ){

        currentPage = "sanatani-ai";

    }


    /* SANATAN SEVA SAMITI */

    else if(
        currentPath.includes("sanatan-seva") ||
        currentPath.includes("samiti")
    ){

        currentPage = "samiti";

    }


    /* DASHBOARD */

    else if(
        currentPath.includes("dashboard")
    ){

        currentPage = "dashboard";

    }


    /* =====================================================
       APPLY ACTIVE MARK
       ===================================================== */

    items.forEach(function(item){

        if(
            item.dataset.page === currentPage
        ){

            item.classList.add(
                "sss-active"
            );

        }

    });


    /* =====================================================
       ANDROID BRIDGE
       ===================================================== */

    items.forEach(function(item){

        item.addEventListener(
            "click",
            function(){

                const page =
                    this.dataset.page;


                if(
                    window.AndroidBridge &&
                    typeof
                    window.AndroidBridge
                    .onBottomNavigationSelected
                    === "function"
                ){

                    try{

                        window.AndroidBridge
                            .onBottomNavigationSelected(
                                page
                            );

                    }
                    catch(error){

                        console.log(
                            "Android navigation error:",
                            error
                        );

                    }

                }

            }
        );

    });


})();


/* =========================================================
   OLD TOGGLE FUNCTION — PRESERVED
   ========================================================= */

function toggleSSS(){

    const sheet =
        document.getElementById(
            "sss-sheet"
        );

    if(sheet){

        sheet.classList.toggle(
            "active"
        );

    }

}

</script>
