<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Sanatani Ð₲ Navigation</title>

<style>

/* =========================================================
   SANATANI Ð₲
   ROYAL JEWEL NAVIGATION
   ORIGINAL FLAGSHIP FOOTER
   ========================================================= */

:root {

    --royal-1: #7D1220;
    --royal-2: #650C18;
    --royal-3: #4A0710;
    --royal-4: #32050B;

    --bhagwa: #F26A05;
    --bhagwa-soft: #FF8A19;

    --gold: #C79A32;
    --gold-light: #F2D477;
    --gold-bright: #FFE9A6;

    --cream: #FFF4D4;
    --cream-soft: rgba(255,244,212,.68);

    --shadow: rgba(35,2,7,.60);

    --footer-height: 88px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #FFF9EF;

    padding-bottom:
        calc(
            var(--footer-height)
            + env(safe-area-inset-bottom)
            + 18px
        );
}


/* =========================================================
   PAGE
   ========================================================= */

#app-content {
    min-height: 100vh;
}


/* =========================================================
   FOOTER STAGE
   ========================================================= */

.sanatani-footer-stage {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 99999;

    height:
        calc(
            var(--footer-height)
            + env(safe-area-inset-bottom)
        );

    padding:
        0
        8px
        env(safe-area-inset-bottom)
        8px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    pointer-events: none;
}


/* =========================================================
   ROYAL FOOTER BODY
   ========================================================= */

.sanatani-bottom-nav {

    position: relative;

    width: 100%;
    max-width: 760px;

    height: var(--footer-height);

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1.22fr
        1fr
        1fr;

    align-items: end;

    padding:
        10px
        5px
        7px;

    pointer-events: auto;

    background:

        radial-gradient(
            ellipse 80% 100% at 50% 0%,
            rgba(242,106,5,.15),
            transparent 62%
        ),

        linear-gradient(
            180deg,
            var(--royal-1) 0%,
            var(--royal-2) 35%,
            var(--royal-3) 76%,
            var(--royal-4) 100%
        );

    border-radius:
        27px
        27px
        0
        0;

    border:
        1px solid
        rgba(242,212,119,.42);

    border-bottom: 0;

    box-shadow:

        0 -8px 35px
        rgba(75,7,15,.25),

        0 -1px 0
        rgba(255,240,184,.18),

        inset 0 1px 0
        rgba(255,255,255,.10);
}


/* =========================================================
   ORNAMENTAL TOP ARCH
   ========================================================= */

.sanatani-bottom-nav::before {

    content: "";

    position: absolute;

    left: 8%;
    right: 8%;

    top: -1px;

    height: 18px;

    border-top:
        1px solid
        rgba(242,212,119,.72);

    border-radius:
        50% 50% 0 0;

    box-shadow:

        0 -2px 8px
        rgba(242,212,119,.16);

    pointer-events: none;
}


/* =========================================================
   CENTRAL ARCH CUT / EMBLEM AREA
   ========================================================= */

.sanatani-bottom-nav::after {

    content: "";

    position: absolute;

    width: 118px;
    height: 42px;

    left: 50%;
    top: -18px;

    transform:
        translateX(-50%);

    background:
        #4A0710;

    border-radius:
        60px
        60px
        0
        0;

    border-top:
        1px solid
        rgba(242,212,119,.45);

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item {

    position: relative;

    width: 100%;
    height: 66px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end;

    gap: 4px;

    color:
        var(--cream-soft);

    text-decoration: none;

    border: 0;

    background: transparent;

    font-family: inherit;

    cursor: pointer;

    padding: 0 2px;

    transition:
        transform .22s ease,
        color .22s ease;
}


.nav-item:active {

    transform:
        scale(.91);
}


/* =========================================================
   ICON FRAME
   ========================================================= */

.nav-icon-box {

    position: relative;

    width: 43px;
    height: 39px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}


/* =========================================================
   ICON
   ========================================================= */

.nav-icon {

    width: 31px;
    height: 31px;

    object-fit: contain;

    display: block;

    opacity: .82;

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,.35)
        );

    transition:
        transform .25s ease,
        opacity .25s ease,
        filter .25s ease;
}


/* =========================================================
   LABEL
   ========================================================= */

.nav-label {

    max-width: 100%;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 9.5px;

    line-height: 1.1;

    font-weight: 600;

    letter-spacing: .05px;

    color: inherit;
}


/* =========================================================
   ACTIVE NORMAL ITEM
   ========================================================= */

.nav-item.active:not(.nav-center) {

    color:
        var(--gold-bright);
}


.nav-item.active:not(.nav-center)
.nav-icon-box {

    background:

        linear-gradient(
            145deg,
            rgba(255,230,158,.12),
            rgba(255,159,30,.035)
        );

    box-shadow:

        inset 0 1px 0
        rgba(255,235,170,.13),

        0 0 20px
        rgba(242,197,91,.08);
}


.nav-item.active:not(.nav-center)
.nav-icon {

    opacity: 1;

    transform:
        translateY(-2px)
        scale(1.08);

    filter:

        drop-shadow(
            0 0 7px
            rgba(255,224,133,.52)
        );
}


/* =========================================================
   ACTIVE JEWEL
   ========================================================= */

.nav-item.active:not(.nav-center)::after {

    content: "";

    position: absolute;

    bottom: 0;

    width: 7px;
    height: 7px;

    transform:
        rotate(45deg);

    background:
        var(--gold-light);

    box-shadow:

        0 0 4px
        rgba(255,228,137,.9),

        0 0 11px
        rgba(255,196,67,.55);
}


/* =========================================================
   CENTER SANATANI Ð₲
   ========================================================= */

.nav-center {

    height: 88px;

    z-index: 10;

    justify-content: flex-end;

    padding-bottom: 0;
}


/* =========================================================
   CENTER ROYAL MEDALLION
   ========================================================= */

.center-icon-wrap {

    position: relative;

    width: 70px;
    height: 70px;

    margin-top: -37px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 50% 27%,
            #9B2031 0%,
            #76101E 37%,
            #520914 72%,
            #35050B 100%
        );

    border:
        1px solid
        var(--gold-light);

    box-shadow:

        0 0 0 3px
        #4A0710,

        0 0 0 4px
        rgba(242,212,119,.48),

        0 0 0 7px
        rgba(74,7,16,.78),

        0 0 28px
        rgba(242,212,119,.27),

        0 11px 23px
        rgba(30,2,5,.50),

        inset 0 2px 0
        rgba(255,242,187,.22);

    overflow: hidden;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}


/* =========================================================
   MEDALLION INNER ORNAMENT
   ========================================================= */

.center-icon-wrap::before {

    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 50%;

    border:
        1px solid
        rgba(242,212,119,.30);

    box-shadow:

        inset 0 0 12px
        rgba(255,211,91,.08);
}


/* =========================================================
   MEDALLION LIGHT
   ========================================================= */

.center-icon-wrap::after {

    content: "";

    position: absolute;

    width: 80%;
    height: 55%;

    left: 10%;
    top: 0;

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse,
            rgba(255,225,137,.22),
            transparent 68%
        );

    pointer-events: none;
}


/* =========================================================
   CENTER IMAGE
   ========================================================= */

.center-icon {

    position: relative;

    z-index: 5;

    width: 51px;
    height: 51px;

    object-fit: contain;

    filter:

        drop-shadow(
            0 0 8px
            rgba(255,222,133,.52)
        );

    transition:
        transform .25s ease;
}


/* =========================================================
   CENTER ACTIVE
   ========================================================= */

.nav-center.active
.center-icon-wrap {

    transform:
        translateY(-3px)
        scale(1.035);

    box-shadow:

        0 0 0 3px
        #4A0710,

        0 0 0 4px
        var(--gold-light),

        0 0 0 7px
        rgba(74,7,16,.85),

        0 0 34px
        rgba(242,212,119,.43),

        0 13px 26px
        rgba(30,2,5,.55),

        inset 0 2px 0
        rgba(255,248,202,.28);
}


.nav-center.active .center-icon {

    transform:
        scale(1.06);
}


/* =========================================================
   CENTER LABEL
   ========================================================= */

.center-label {

    color:
        var(--gold-bright);

    font-size: 9.5px;

    font-weight: 700;

    line-height: 1;

    white-space: nowrap;

    text-shadow:
        0 1px 4px
        rgba(0,0,0,.55);
}


/* =========================================================
   SAMITI IMAGE
   ========================================================= */

.samiti-icon {

    width: 32px;
    height: 32px;

    border-radius: 50%;

    object-fit: cover;

    border:
        1px solid
        rgba(242,212,119,.70);

    box-shadow:

        0 2px 7px
        rgba(0,0,0,.35);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


.nav-item.active .samiti-icon {

    transform:
        scale(1.08);

    box-shadow:

        0 0 11px
        rgba(242,212,119,.42);
}


/* =========================================================
   DASHBOARD
   ========================================================= */

.dashboard-icon {

    width: 32px;
    height: 32px;

    object-fit: contain;

    display: block;

    opacity: .83;

    filter:
        drop-shadow(
            0 2px 4px
            rgba(0,0,0,.35)
        );

    transition:
        transform .25s ease,
        opacity .25s ease,
        filter .25s ease;
}


.nav-item.active .dashboard-icon {

    opacity: 1;

    transform:
        scale(1.07);

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,222,133,.50)
        );
}


/* =========================================================
   SIDE ORNAMENTAL POINTS
   ========================================================= */

.nav-item:first-child::before,
.nav-item:nth-child(2)::before,
.nav-item:nth-child(4)::before,
.nav-item:last-child::before {

    content: "";

    position: absolute;

    top: 3px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        rgba(242,212,119,.30);
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    :root {
        --footer-height: 84px;
    }

    .sanatani-bottom-nav {

        padding-left: 3px;
        padding-right: 3px;

        border-radius:
            23px
            23px
            0
            0;
    }

    .nav-item {
        height: 62px;
    }

    .nav-icon {
        width: 28px;
        height: 28px;
    }

    .samiti-icon,
    .dashboard-icon {
        width: 28px;
        height: 28px;
    }

    .nav-label {
        font-size: 8.4px;
    }

    .center-icon-wrap {
        width: 62px;
        height: 62px;
        margin-top: -31px;
    }

    .center-icon {
        width: 45px;
        height: 45px;
    }

    .center-label {
        font-size: 8.4px;
    }
}


/* =========================================================
   VERY SMALL DEVICES
   ========================================================= */

@media (max-width: 330px) {

    .nav-label {
        font-size: 7.8px;
    }

    .center-label {
        font-size: 7.8px;
    }

    .center-icon-wrap {
        width: 58px;
        height: 58px;
    }

    .center-icon {
        width: 42px;
        height: 42px;
    }
}


/* =========================================================
   SAFE AREA
   ========================================================= */

@supports (padding-bottom: env(safe-area-inset-bottom)) {

    .sanatani-footer-stage {

        padding-bottom:
            env(safe-area-inset-bottom);
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation: none !important;

        transition: none !important;
    }
}

</style>
</head>


<body>


<main id="app-content"></main>


<!-- =======================================================
     SANATANI Ð₲
     ROYAL JEWEL FOOTER
     ======================================================= -->

<div class="sanatani-footer-stage">

<nav
    class="sanatani-bottom-nav"
    id="sanataniBottomNav"
    aria-label="मुख्य नेविगेशन"
>


    <!-- ===================================================
         HOME
         =================================================== -->

    <a
        href="app_home.php"
        class="nav-item"
        data-page="home"
        aria-label="Home"
    >

        <span class="nav-icon-box">

            <img
                src="branding/footer/home.png"
                class="nav-icon"
                alt="Home"
            >

        </span>

        <span class="nav-label">
            Home
        </span>

    </a>



    <!-- ===================================================
         FEED
         =================================================== -->

    <a
        href="feed.php"
        class="nav-item"
        data-page="feed"
        aria-label="Feed"
    >

        <span class="nav-icon-box">

            <img
                src="branding/footer/feed.png"
                class="nav-icon"
                alt="Feed"
            >

        </span>

        <span class="nav-label">
            Feed
        </span>

    </a>



    <!-- ===================================================
         SANATANI Ð₲
         =================================================== -->

    <a
        href="sanatani-ai.php"
        class="nav-item nav-center"
        data-page="sanatani-ai"
        aria-label="Sanatani Ð₲"
    >

        <span class="center-icon-wrap">

            <img
                src="branding/footer/Ð₲.png"
                class="center-icon"
                alt="Sanatani Ð₲"
            >

        </span>

        <span class="center-label">
            Sanatani Ð₲
        </span>

    </a>



    <!-- ===================================================
         SANATAN SEVA SAMITI
         =================================================== -->

    <a
        href="sanatan-seva-samiti.php"
        class="nav-item"
        data-page="samiti"
        aria-label="Sanatan Seva Samiti"
    >

        <span class="nav-icon-box">

            <img
                src="branding/footer/PRO1781011172_dp.jpg"
                class="samiti-icon"
                alt="Sanatan Seva Samiti"
            >

        </span>

        <span class="nav-label">
            Sanatan Seva Samiti
        </span>

    </a>



    <!-- ===================================================
         DASHBOARD
         =================================================== -->

    <a
        href="dashboard.php"
        class="nav-item"
        data-page="dashboard"
        aria-label="Dashboard"
    >

        <span class="nav-icon-box">

            <img
                src="branding/footer/accounts.png"
                class="dashboard-icon"
                alt="Dashboard"
            >

        </span>

        <span class="nav-label">
            Dashboard
        </span>

    </a>


</nav>

</div>



<script>

/* =========================================================
   SANATANI Ð₲ NAVIGATION ENGINE
   ========================================================= */

(function () {

    "use strict";


    const nav =
        document.getElementById(
            "sanataniBottomNav"
        );


    if (!nav) {
        return;
    }


    const items =
        nav.querySelectorAll(
            ".nav-item"
        );


    /* =====================================================
       PAGE DETECTION
       ===================================================== */

    const currentPath =
        window.location.pathname
            .split("/")
            .pop()
            .toLowerCase();


    let currentPage =
        "home";


    if (
        currentPath === "feed.php" ||
        currentPath.includes("feed")
    ) {

        currentPage =
            "feed";

    }

    else if (
        currentPath.includes("sanatani-ai")
    ) {

        currentPage =
            "sanatani-ai";

    }

    else if (
        currentPath.includes("sanatan-seva") ||
        currentPath.includes("samiti")
    ) {

        currentPage =
            "samiti";

    }

    else if (
        currentPath.includes("dashboard")
    ) {

        currentPage =
            "dashboard";

    }

    else if (
        currentPath.includes("app_home")
    ) {

        currentPage =
            "home";

    }


    /* =====================================================
       ACTIVE ITEM
       ===================================================== */

    items.forEach(function (item) {

        const page =
            item.getAttribute(
                "data-page"
            );


        if (
            page === currentPage
        ) {

            item.classList.add(
                "active"
            );

        }

        else {

            item.classList.remove(
                "active"
            );

        }

    });


    /* =====================================================
       ANDROID BRIDGE
       ===================================================== */

    items.forEach(function (item) {

        item.addEventListener(
            "click",
            function () {

                const page =
                    this.getAttribute(
                        "data-page"
                    );


                if (
                    window.AndroidBridge &&
                    typeof
                    window.AndroidBridge
                        .onBottomNavigationSelected
                    === "function"
                ) {

                    try {

                        window.AndroidBridge
                            .onBottomNavigationSelected(
                                page
                            );

                    }

                    catch (error) {

                        console.log(
                            "Android navigation error:",
                            error
                        );

                    }

                }

            }
        );

    });

})();

</script>
